[project]
name = "robotframework-allurevisitor"
version = "0.1.0"
description = "Generate Allure input files from a Robot Framework output.xml — an offline alternative to the allure-robotframework listener."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Many Kasiriha", email = "many.kasiriha@gmail.com" },
]
keywords = [
    "robotframework",
    "allure",
    "allure-report",
    "testing",
    "reporting",
    "output.xml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: Robot Framework",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
]
dependencies = [
    "allure-python-commons>=2.16.0",
    "robotframework>=7.4.2",
]

[project.urls]
Homepage = "https://github.com/manykarim/robotframework-allurevisitor"
Repository = "https://github.com/manykarim/robotframework-allurevisitor"
Issues = "https://github.com/manykarim/robotframework-allurevisitor/issues"

[project.scripts]
rf-allure = "robotframework_allurevisitor.cli:main"
allurevisitor = "robotframework_allurevisitor.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotframework_allurevisitor"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: full Robot -> rf-allure -> Allure report pipeline test (needs an Allure CLI)",
]
